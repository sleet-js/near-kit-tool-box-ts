name: RELEASE

# Manual release. Bumps every workspace package to one version, commits,
# tags, builds, and publishes to npm with trusted publishing (OIDC).
#
# The git tag and the npm version are always the same string:
#   tag v0.3.0  <->  npm @near-kit-tool-box/*@0.3.0
#
# The packages are pre-1.0, so the bump is `minor` or `patch` only — there is
# no `major` option. A breaking change ships as a `minor` bump; a `major`
# bump would take the packages to 1.0.0 and imply a stability promise they
# do not make. No major bumps, whatever the change.
#
# First-time setup on npmjs.com (per package, once):
#   Package Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user : sleet-js
#     Repository           : near-kit-tool-box-ts
#     Workflow filename    : release.yml
#     Allowed actions      : npm publish
#   The config must complete its first publish within 2 days or it expires.
#
# NOTE: this `name:` is only the label shown in the Actions UI. npm matches the
# trusted publisher on the workflow FILENAME (release.yml) and the repository,
# never on this field. Renaming it here does not affect publishing.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        required: true
        default: minor
        options:
          - minor
          - patch
      version:
        description: "Exact version to release (leave blank to use the bump type)"
        type: string
        required: false
        default: ""

# Only the default branch may cut a release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # commit the version bump and push the tag
  id-token: write # REQUIRED for npm OIDC trusted publishing

env:
  NODE_VERSION: "24"
  NPM_VERSION: "12.2.1" # >= 11.5.1 for trusted publishing

jobs:
  release:
    name: Bump, tag, and publish
    runs-on: ubuntu-latest
    # Restrict publishing to the main branch.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so version-sync can read tags
          persist-credentials: true # needed to push the commit and tag

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      - name: Install npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute the release version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(bun run scripts/release-version.ts "${{ inputs.bump }}")"
          fi
          # npm requires a plain semver version. Reject anything else before
          # we bump, commit, or tag.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a valid version (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi
          # A tag and an npm version must be the same string.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Releasing version $VERSION (tag v$VERSION)"

      - name: Bump every package to the release version
        run: bun run scripts/version-sync.ts "${{ steps.version.outputs.version }}"

      - name: Verify the bump landed
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for pkg in packages/*/package.json; do
            got="$(node -p "require('./$pkg').version")"
            if [ "$got" != "$VERSION" ]; then
              echo "::error::$pkg is at $got, expected $VERSION"
              exit 1
            fi
            echo "  OK  $pkg  $got"
          done

      - name: Commit the version bump
        run: |
          set -euo pipefail
          git config user.name  "sleet-ai"
          git config user.email "sleet-ai@outlook.com"
          git add packages/*/package.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — versions already at the target."
          else
            git commit -m "chore: bump all packages to v${{ steps.version.outputs.version }}"
          fi
          # Push the bump so the tag points at a commit that exists on the remote.
          git push origin HEAD:${{ github.ref_name }}

      - name: Create and push the git tag
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists — bump to a new version or delete the tag."
            exit 1
          fi
          # Tag the release commit. The tag string must equal the npm version.
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "refs/tags/$TAG"
          echo "Pushed tag $TAG"

      - name: Build all packages
        run: bun run rebuild

      - name: Publish to npm
        # The packages are independent, so publish them in dependency order.
        # Each publish uses OIDC — there is no NPM_TOKEN secret in this repo.
        run: |
          set -euo pipefail
          for pkg in packages/env packages/fun packages/web; do
            echo ""
            echo "::group::Publishing $pkg"
            ( cd "$pkg" && npm publish --access public )
            echo "::endgroup::"
          done

      - name: Verify the published versions
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # Query the per-version registry endpoint rather than `npm view`:
          # npm view reads a cached packument, so a freshly published version
          # can stay invisible for minutes. This endpoint 404s until the
          # version is really live, and never serves a stale copy.
          for pkg in "@near-kit-tool-box/env" "@near-kit-tool-box/fun" "@near-kit-tool-box/web"; do
            ok=false
            for _ in $(seq 1 30); do
              if curl -sf -o /dev/null \
                "https://registry.npmjs.org/${pkg/\//%2f}/$VERSION"; then
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != "true" ]; then
              echo "::error::$pkg@$VERSION is not on the registry"
              exit 1
            fi
            echo "  OK  $pkg@$VERSION"
          done

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
